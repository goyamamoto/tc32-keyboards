# The V21 with the own BLE stack and ZMK Studio over a USB serial port (experimental): build with
#   EXTRA_CONF="<cidoo_v21_ble.conf>;<this file>" KEYMAP=<cidoo_v21_studio.keymap> \
#   EXTRA_MODULES="<nanopb>;<zmk-studio-messages>" tc32/scripts/build.sh cidoo_v21
CONFIG_ZMK_STUDIO=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=256

# The keymap Studio saves: the settings backend in the storage partition (tlsr_settings_log.c)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y
CONFIG_NVS=n
CONFIG_FLASH_MAP=n

# The mode switch sets the preferred endpoint at every boot: it is not kept in the settings, so the
# settings are written only when Studio saves
CONFIG_ZMK_ENDPOINTS_SETTINGS=n

# Behavior IDs from the names' CRC-16 (build.sh checks that no two are alike): no table kept in the
# settings, nothing written at the first boot
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# The 32 KB RAM: stacks for the deepest use seen in the emulator, each with at least a quarter left: main 488
# (tc32_rng's init storing its seed record), Studio RPC 1,552, system work queue 1,288, update thread 784,
# ZMK's low-priority queue 344 (the backlight's steps, the Num Lock indicator over them), USB work queue 224,
# watchdog feeder 184 octets; the idle thread, which also runs the low-power suspend, 184. The interrupt stack
# (808 at most) 1,280; the BLE thread's (728 at most) keeps its default. The startup code takes the interrupt
# stack's end from the link.
CONFIG_MAIN_STACK_SIZE=656
CONFIG_IDLE_STACK_SIZE=248
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1720
CONFIG_TLSR_USB_OTA_STACK_SIZE=1176
CONFIG_USB_WORKQUEUE_STACK_SIZE=368
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=472
CONFIG_TLSR_BOOT_GUARD_FEEDER_STACK_SIZE=248
CONFIG_ISR_STACK_SIZE=1280
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=32

# The constants the key path reads from the flash (the GPIO driver's API table, the ports' device structures,
# their configs) each in a flash cache slot of its own: checked by build.sh (tc32/scripts/hot_slots.py; --pads
# names the changes of the pad after the hot text, hot_text.ld, with which they are; this build's link leaves no
# slot shared with a pad of 0 bytes and with most others: the key matrix runs from RAM, only the debouncer lies
# in the flash)
CONFIG_TLSR_HOT_TEXT_PAD=0
CONFIG_TLSR_HOT_TEXT_CHECK=y

# No console: no boot banner, no printk (the keymap writes its settings keys without a formatter;
# nothing else formats a string).
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_CBPRINTF_NANO=y

# Functions return with pop {..., pc}; the compile units of the code executed from reset until the
# boot is counted and the power-on chord can take the keyboard back to the other slot (the boot
# guard's early stage) keep the classic returns (zmk-tc32 tc32/boot_path_units.txt), and build.sh
# checks that code against cidoo_v21_studio_boot_path.txt. The configuration stops with a clang that lacks
# the noarm target feature.
CONFIG_TC32_POP_PC_RETURNS=y

# No settings handlers registered at run time: all are static.
CONFIG_SETTINGS_DYNAMIC_HANDLERS=n
