# The V21 with the own BLE stack (experimental): build with
#   EXTRA_CONF=<this file> KEYMAP=<cidoo_v21_ble.keymap> tc32/scripts/build.sh cidoo_v21
CONFIG_TLSR_BLE=y

# The BLE keymap's hold-taps (the three BLE channel keys, used one at a time): tables
# for 2 held and 8 captured events instead of ZMK's 10 and 40, 2.2 KB less of the
# 22 KB RAM.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=2
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=8

# The proprietary 2.4G link in the switch's 2.4G position (src/ble/p24.c)
CONFIG_TLSR_P24=y

# The 2.4G link's receive started by the radio itself: an interrupt held back by
# code taking flash cache misses otherwise starts it after the dongle's reply
CONFIG_TLSR_P24_AUTO_RX=y
