# The V75 Pro with the own BLE stack, the 2.4G link and the backlight: build with
#   EXTRA_CONF=<this file> KEYMAP=<cidoo_v75pro_wireless.keymap> tc32/scripts/build.sh cidoo_v75pro
CONFIG_TLSR_BLE=y

# The BLE keymap's hold-taps (the three BLE channel keys, used one at a time): tables
# for 2 held and 8 captured events instead of ZMK's 10 and 40.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=2
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=8

# The proprietary 2.4G link in the switch's 2.4G position (src/ble/p24.c)
CONFIG_TLSR_P24=y

# The 2.4G link's receive started by the radio itself: the V75 Pro serves the
# TX interrupt too late for the dongle's reply otherwise
CONFIG_TLSR_P24_AUTO_RX=y

# The backlight (src/led_driver_spi.c), its keys in cidoo_v75pro_wireless.keymap
CONFIG_LED_DRIVER_SPI=y

# USB only in the wired position: in BT and 2.4G the cable only brings power.
CONFIG_TLSR_USB_WIRED_POSITION_ONLY=y
