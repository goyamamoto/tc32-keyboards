# The V65 V3 with the own BLE stack, the 2.4G link and the backlight: build with
#   EXTRA_CONF=<this file> KEYMAP=<cidoo_v65v3_studio.keymap or a keymap with &kbl> tc32/scripts/build.sh cidoo_v65v3
# (with the Studio conf after it for ZMK Studio and US-JIS).
CONFIG_TLSR_BLE=y

# The BLE keymap's hold-taps (the three BLE channel keys, used one at a time): tables
# for 2 held and 8 captured events instead of ZMK's 10 and 40.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=2
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=8

# The proprietary 2.4G link when it is the link chosen (Fn + R; src/ble/p24.c)
CONFIG_TLSR_P24=y

# The 2.4G link's receive started by the radio itself: the chip serves the TX
# interrupt too late for the dongle's reply otherwise
CONFIG_TLSR_P24_AUTO_RX=y

# The backlight (src/led_driver_spi.c with this board's led_driver_table.h), its keys in the keymap
CONFIG_LED_DRIVER_SPI=y

# USB only in the wired mode (the cable's power with USB the link chosen): in the wireless links the
# cable only brings power, until &usb_on (Fn + U) brings USB up for the host tools.
CONFIG_TLSR_USB_WIRED_POSITION_ONLY=y
