# SPDX-License-Identifier: GPL-3.0-or-later
# The V65 V3 with the own BLE stack, the 2.4G link, the backlight and ZMK Studio over a USB serial
# port: build with
#   EXTRA_CONF="<cidoo_v65v3_wireless.conf>;<this file>" KEYMAP=<cidoo_v65v3_studio.keymap> \
#   EXTRA_MODULES="<nanopb>;<zmk-studio-messages>" tc32/scripts/build.sh cidoo_v65v3
CONFIG_ZMK_STUDIO=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# The keymap Studio saves: the settings backend in the storage partition (tlsr_settings_log.c)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_CUSTOM=y
CONFIG_NVS=n
CONFIG_FLASH_MAP=n

# The cable's power (PD7) sets the preferred endpoint at every boot: it is not kept in the settings, so the
# settings are written only when Studio saves
CONFIG_ZMK_ENDPOINTS_SETTINGS=n

# Behavior IDs from the names' CRC-16 (build.sh checks that no two are alike): no table kept in the
# settings, nothing written at the first boot
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# The 32 KB RAM. Studio keeps the keymap in RAM (67 positions, four layers: 3,216 octets) and adds
# its RPC thread. The room for them:
# - stacks sized for the deepest use seen in the emulator over the wired, BT, 2.4G, backlight and
#   Studio scenarios on this board and on the V75 Pro, each with at least a quarter left (the
#   runner's --stacks check): main 464, idle 280, system work queue 1,280, update thread 808 (the
#   confirm's flash test), Studio RPC 1,624, BLE thread 880 octets (a Passkey Entry pairing); the
#   interrupt stack (792 at most) 1,280. The startup code takes the interrupt stack's end from the
#   link.
CONFIG_MAIN_STACK_SIZE=624
CONFIG_IDLE_STACK_SIZE=376
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1712
CONFIG_TLSR_USB_OTA_STACK_SIZE=1080
CONFIG_TLSR_BLE_STACK_SIZE=1176
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2168
CONFIG_ISR_STACK_SIZE=1280
# - the queue of behaviours waiting to run (macros): 16 entries for the keymap's two-step macros
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=16
# - ZMK's per-position tables in one octet a position
CONFIG_ZMK_KEYMAP_SMALL_POSITION_TABLES=y
# - the watchdog feeder's stack (200 deep at most), the USB work queue's (320)
CONFIG_TLSR_BOOT_GUARD_FEEDER_STACK_SIZE=272
CONFIG_USB_WORKQUEUE_STACK_SIZE=432
# - the key events waiting for the keymap: 16, with the 3 ms scan
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
# - the serial port's rings: Studio's requests are a few dozen octets, its answers go out in 64; the
#   RPC's own receive buffer takes a whole request (a 20-character layer name is 34 octets)
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=64
# - the RAM starts right after the instruction cache's scratch (0x840000 + the boot copy, aligned to
#   256, + 0x900), as Telink's own link layout has it: the 0x700 kept free for a larger boot copy
#   is 1,792 octets of data instead (the link stops when the boot copy no longer fits)
CONFIG_TC32_BOOT_MIRROR_SIZE=0x2100

# The constants the key scan reads at every GPIO call (the GPIO driver's API table, the ports' device
# structures, their configs) each in a flash cache slot of its own: checked by build.sh
# (tc32/scripts/hot_slots.py; --pads names the changes of the pad after the hot text, hot_text.ld, with
# which they are; this build's link leaves no slot shared with pads of 128 and 160 bytes)
CONFIG_TLSR_HOT_TEXT_PAD=160
CONFIG_TLSR_HOT_TEXT_CHECK=y

# The Windows/Mac mode: the Mac layer (2) on or off, kept over a boot
CONFIG_TLSR_KEPT_LAYER=2

# The watchdog feeder one priority above Studio's RPC thread (the lowest application priority):
# encoding the 67-key, 4-layer keymap takes seconds on the chip
CONFIG_TLSR_BOOT_GUARD_FEEDER_PRIO_ABOVE_LOWEST=1

# US-JIS (src/usjis.c): no substitution on the Mac layers (Mac, Mac Fn)
CONFIG_ZMK_USJIS_LAYER_EXCLUDE_MASK=0x0c

# No console: no boot banner, no printk (the keymap writes its settings keys without a formatter;
# nothing else formats a string).
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_CBPRINTF_NANO=y

# Functions return with pop {..., pc}; the compile units of the code executed from reset until the
# boot is counted and the power-on chord can take the keyboard back to the other slot (the boot
# guard's early stage) keep the classic returns (zmk-tc32 tc32/boot_path_units.txt), and build.sh
# checks that code against cidoo_v65v3_studio_boot_path.txt. The configuration stops with a clang that lacks
# the noarm target feature.
CONFIG_TC32_POP_PC_RETURNS=y

# No settings handlers registered at run time: all are static.
CONFIG_SETTINGS_DYNAMIC_HANDLERS=n
