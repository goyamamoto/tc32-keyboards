# The V65 V3 with the own BLE stack: build with
#   EXTRA_CONF=<this file> KEYMAP=<cidoo_v65v3_ble.keymap> tc32/scripts/build.sh cidoo_v65v3
# No mode switch: the cable's power (PD7) decides wired or wireless
# (CONFIG_TLSR_BLE_MODE_FROM_POWER_IN, on in Kconfig.defconfig).
CONFIG_TLSR_BLE=y

# The BLE keymap's hold-taps (the three BLE channel keys, used one at a time): tables
# for 2 held and 8 captured events instead of ZMK's 10 and 40.
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_HELD=2
CONFIG_ZMK_BEHAVIOR_HOLD_TAP_MAX_CAPTURED_EVENTS=8

# The 2.4G link (src/ble/p24.c) waits for the V75 Pro's receive fix: BLE only for now.
CONFIG_TLSR_P24=n
